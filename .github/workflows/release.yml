name: release

on:
  # CI が通った main への push はすべて release にする。install.sh は latest を取るので、
  # 最後に手で切った tag ではなく main の中身が配られる。
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 手で push した tag はその tag のまま release にする。確定版はこれで切る。
  push:
    tags: ["v*"]
  # 既に push 済みの tag を release し直す (途中で落ちた run の再実行など)。新しい tag は
  # ここでは切れない。無い tag は checkout で落ちる。確定版は tag を push して切る。
  workflow_dispatch:
    inputs:
      tag:
        description: "release し直す既存の tag (例: v0.1.0)"
        required: true

# 権限は job ごとに必要な分だけ付ける
permissions: {}

defaults:
  run:
    shell: bash

# main の自動 release どうしだけを 1 本ずつ流す (同じ最大 tag を読んで同じ次の tag を取り合わ
# ないため)。pending は 1 本しか持てず新しい方が古い方を取り消すが、main では古い commit は
# どのみち release しない。手で push した tag の release は run ごとに別の group に入れ、
# 後続の main の run に取り消されないようにする。
#
# main の group に入れるのは「その repo の main への push に対する CI の run」だけ。それ以外の
# workflow_run (この repo の PR も、fork の main という名前の branch への push も) も起きるが、
# どれも jobs を全部 skip するだけ。Cancel ができるかどうかは job ではなく run で決まるので、
# それらの run まで同じ group に入ると、skip されるはずの run が待ち行列の main の run を
# 取り消す。
concurrency:
  group: >-
    release-${{ github.event_name == 'workflow_run' &&
    (github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_repository.full_name == github.repository && 'main' ||
    github.run_id) || github.run_id }}
  cancel-in-progress: false

jobs:
  # action は tag ではなく commit で固定する (版は行末コメント)。publish job は
  # contents:write を持ち provenance に署名するので、動かされた tag の下で差し替えられた
  # action は「自分たちが作った」ものとして attest されてしまう。
  tag:
    # workflow_run は main という名前の branch の CI すべてで起きる。fork の PR の main
    # も含むので、この repo の main への push だけを release にする。
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # repo のコード (mise / bun / script / check) を動かす job なので書き込み権限を持たせない
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      # 入力を checkout の ref に使う前に見る。branch 名を渡されて、その branch の中身が
      # tag の名前で release されるのを防ぐ。形は publish-release.sh が比べる形と同じで、数を
      # 0 始まりにせず 9 桁までにする。ここで落ちれば checkout も build も走らない。
      - name: check the requested tag
        if: github.event_name != 'workflow_run'
        env:
          GIVEN: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shape='^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-rc\.(0|[1-9][0-9]{0,8}))?$'
          [[ "$GIVEN" =~ $shape ]] || { echo "::error::tag must be vX.Y.Z or vX.Y.Z-rc.N, 9 digits per number at most and no leading zero: $GIVEN"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.ref }}
          # 次の tag を数えるための全 tag と、main が進んだかを見るための origin/main
          fetch-depth: 0
          persist-credentials: false
      # setup-bun は .mise.toml を読めない (.tool-versions と package.json と .bun-version
      # だけ) ので、CI と同じ mise で bun の版を .mise.toml 1 か所に保つ。cache を切るのは、
      # 署名権限を持つ job に書き込み可能な cache を持ち込まないため。
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false

      # main の run は CI が通った commit なのでそのまま使う。tag と dispatch は CI を通って
      # いない commit を指せるので、build の前にここで通す。
      - name: check
        if: github.event_name != 'workflow_run'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check

      - name: decide the tag
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != workflow_run ]; then
            echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main にはもっと新しい commit があり、その run が release する。古い方を後から
          # release すると古いコードが latest になる。origin/main が引けないときは、
          # 「進んでいない」と読まず job ごと落とす (空文字との比較で黙って skip しない)。
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_sha="$(git rev-parse --verify refs/remotes/origin/main)"
          head_sha="$(git rev-parse HEAD)"
          if [ "$main_sha" != "$head_sha" ]; then
            # build が skip される理由が run summary に残らないと、「緑なのに release が無い」
            # ようにしか見えないので annotation にする。
            echo "::notice::main has moved to ${main_sha}; this run for ${head_sha} releases nothing"
            exit 0
          fi
          # 同じ commit の再実行は、別の tag を切らず前回の tag を使う。
          # 自動の再実行が使い直すのは自分が切った rc の tag だけ。同じ commit に手の正式版があっても選ばない
          rc_tags="$(git tag --points-at HEAD --list 'v*-rc.*')"
          # 一致が 0 件の grep は 1 で抜けるので、それだけを空として受ける (git の失敗は上の代入で止まる)。
          # publish-release.sh と同じ形で見るので、ここで拾った tag は後で release できる
          existing="$(printf '%s\n' "$rc_tags" | grep -E '^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})-rc\.(0|[1-9][0-9]{0,8})$' | sort -V | tail -n 1)" || existing=""
          # コマンド置換は代入に分ける。echo の引数の中に置くと、失敗しても set -e が止まらず
          # 空の tag で緑のまま終わる。
          if [ -n "$existing" ]; then
            tag="$existing"
          else
            tag="$(bun scripts/next-tag.ts)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    # 書き込み権限と署名権限を持たない。tag や release を作れるのは publish job だけで、
    # 動かされた tag の下で build が tag を切る余地を残さない。
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # 手動実行では inputs.tag と default branch の HEAD が食い違う。ref を明示しないと
      # tag と中身が違うバイナリが release に載り、後から見分けられない。tag が無ければ
      # ここで落ちる。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.ref }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - run: bun install --frozen-lockfile

      # bun はクロスコンパイルできるので 4 つとも 1 台で作る。OS ごとに runner を分けると、
      # 同じ入力から作ったという保証が弱くなる。build の中身は scripts/build.ts が正。
      # RELEASE_TAG は --version に埋め込まれる。
      - name: build
        env:
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          set -eux
          bun run build
          cd dist && sha256sum 9router-cli-* > SHA256SUMS && cat SHA256SUMS

      # この runner で動くのは linux-x64 だけ。--version は埋め込みが効いたかの検査で、
      # tag と違う版を名乗るバイナリは配らない。残り 3 つはここからは動かせないので、
      # check-binaries.sh が file(1) で形と埋め込みを見てから、この 1 個を走らせる。
      # 残り 3 個を動かせるのは verify job の runner だけなので、実行はそちらに任せる
      - name: check the built binaries
        run: sh scripts/check-binaries.sh

      # 公開する物はここで上げる archive だけ。publish も verify もそれを落とすだけなので、
      # 検査したものと公開するものは同じ物になる。1 つも上がらないと publish は空の dist を
      # 配すので、上げる前に落とす
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          if-no-files-found: error
          path: |
            dist/9router-cli-*
            dist/SHA256SUMS

  verify:
    needs: [tag, build]
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
    # 1 つが動かないと他も止まると、どれが駄目だったかが run から読めなくなる。
    # 4 つとも回して、落ちたものだけを公開しない
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # 走らせる script は build と同じ commit から取る。使うのは script 1 本だけで、
      # bun も mise も要らない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      - name: check the sum and run the binary
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          # 落とした物を、build が出した sums と突き合わせる。macOS に sha256sum は無いので
          # そこでは shasum を使う (build が動くのは ubuntu だけなので揃わない)
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi
          sh scripts/run-binary.sh "dist/9router-cli-$TARGET" "$TAG"

  # verify が 4 つとも走らせた形だけを公開する。needs の job が 1 つでも落ちた (または
  # skip された) run では何も公開しない
  publish:
    needs: [tag, build, verify]
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      # checksum は同じ release の中にあるので真正性の証明にならない。どの workflow が
      # どの commit から作ったかを検証できるよう provenance を付ける。
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # 手動実行では inputs.tag と default branch の HEAD が食い違う。ref を明示しないと
      # tag と中身が違うバイナリが release に載り、後から見分けられない。tag が無ければ
      # ここで落ちる。
      # release の中身と落とした dist/ を紐づけるので、build と同じ commit の script を checkout する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.ref }}
          persist-credentials: false

      # build が上げたものをそのまま落とす。attest の対象も release に載るのも、この dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      # 4 個とも build が出した sums に合うことを確かめてから署名する。署名も release に載るのも
      # この dist/ なので、公開する物と署名する物を別にしない
      - name: check the sums
        run: |
          set -eux
          cd dist && sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/9router-cli-*"

      # publish-release.sh は tag を API で先に作ってから release を作る。contents: write は tag を
      # 作るためだけでなく、release そのものにも要る。
      # この token で作った tag は workflow を起動しないので、上の tag push の trigger で
      # 二重に release されない。
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          # 3 つの経路 (push / workflow_run / workflow_dispatch) で「main の先頭でない commit の
          # tag」をどう扱うかが変わる。スクリプトは event 名でしか見分けられないので渡す
          RELEASE_TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # main の先頭と比べるためと、publish-release.sh が「その tag が既に誰のものか」を確かめる
          # ため。版の比較は gh release list で行う。checkout は shallow なので tag は勝手には取られない。
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*'
          MAIN_SHA="$(git rev-parse --verify refs/remotes/origin/main)"
          export MAIN_SHA
          sh scripts/publish-release.sh
